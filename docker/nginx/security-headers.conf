# Security headers. Included at server level AND in every location that uses
# add_header (see default.conf). `always` adds them to 4xx/5xx responses too.
#
# CSP notes:
# - No external scripts, fonts or APIs, so everything is 'self'.
# - MUI/Emotion injects <style> tags at runtime, hence style-src 'unsafe-inline'.
# - The image is built with INLINE_RUNTIME_CHUNK=false, so no inline scripts.
# - Cloudflare Rocket Loader, Email Obfuscation and Web Analytics auto-inject
#   must stay OFF, or they inject scripts this policy blocks.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

# Browsers ignore HSTS over plain HTTP, so this is harmless for local runs.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
