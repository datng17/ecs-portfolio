# Main nginx config for nginxinc/nginx-unprivileged (runs as UID 101).
# Every writable path lives under /tmp so the root filesystem can be read-only.

worker_processes auto;
pid              /tmp/nginx.pid;
error_log        /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    proxy_temp_path       /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    sendfile      on;
    tcp_nopush    on;

    # Must be longer than the ALB idle timeout (60 s). Otherwise nginx may close
    # an idle connection the ALB is about to reuse, which surfaces as 502s.
    keepalive_timeout 65s;

    # Static site: no request bodies expected.
    client_max_body_size 1k;

    # Client IP from X-Forwarded-For (ALB / Cloudflare), see snippets/real-ip.conf.
    include /etc/nginx/snippets/real-ip.conf;

    # One JSON object per line, ready for CloudWatch Logs Insights.
    # The X-Origin-Verify secret header is intentionally never logged.
    log_format json escape=json
        '{'
            '"time":"$time_iso8601",'
            '"request_id":"$request_id",'
            '"client_ip":"$remote_addr",'
            '"peer_ip":"$realip_remote_addr",'
            '"x_forwarded_for":"$http_x_forwarded_for",'
            '"cf_connecting_ip":"$http_cf_connecting_ip",'
            '"cf_ray":"$http_cf_ray",'
            '"amzn_trace_id":"$http_x_amzn_trace_id",'
            '"method":"$request_method",'
            '"host":"$host",'
            '"uri":"$request_uri",'
            '"protocol":"$server_protocol",'
            '"status":$status,'
            '"bytes_sent":$body_bytes_sent,'
            '"request_time":$request_time,'
            '"referer":"$http_referer",'
            '"user_agent":"$http_user_agent"'
        '}';
    access_log /dev/stdout json;

    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        image/x-icon;

    include /etc/nginx/conf.d/*.conf;
}
