# Portfolio server block.
#
# nginx gotcha: add_header in a location replaces (does not extend) the headers
# set at server level. Every location that sets Cache-Control therefore
# includes the security-headers snippet again.

server {
    listen      8080 default_server;
    server_name _;

    root  /usr/share/nginx/portfolio;
    index index.html;

    include /etc/nginx/snippets/security-headers.conf;

    # Liveness for the Docker HEALTHCHECK, ECS container healthCheck and the ALB
    # target group. Not logged, so health probes don't flood CloudWatch.
    location = /healthz {
        access_log   off;
        default_type text/plain;
        add_header   Cache-Control "no-store" always;
        include      /etc/nginx/snippets/security-headers.conf;
        return 200 "ok\n";
    }

    # Content-hashed CRA bundles: cache forever. A missing file is a real 404,
    # never the SPA fallback (that would serve HTML as JavaScript).
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include    /etc/nginx/snippets/security-headers.conf;
        try_files  $uri =404;
    }

    # The HTML shell must always be revalidated so new deploys show up at once.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        include    /etc/nginx/snippets/security-headers.conf;
    }

    # SPA fallback: unknown paths get the app shell (revalidated, like index.html).
    # Un-hashed root files (favicon, manifest, logos) get a short cache.
    location / {
        add_header Cache-Control "public, max-age=3600" always;
        include    /etc/nginx/snippets/security-headers.conf;
        try_files  $uri /index.html;
    }

    # No dotfiles (.git, .env, ...) even if one ever ends up in the image.
    location ~ /\. {
        access_log off;
        return 404;
    }
}
