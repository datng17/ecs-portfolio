# Restore the real client IP into $remote_addr.
#
# Request path: client -> Cloudflare -> ALB -> task.
# X-Forwarded-For reaching nginx is "<client>, <cloudflare edge>", and the TCP
# peer is the ALB (private VPC address). With real_ip_recursive, nginx walks
# XFF from the right and skips every trusted hop, leaving the client IP.
# The original peer stays available as $realip_remote_addr (logged as peer_ip).

real_ip_header    X-Forwarded-For;
real_ip_recursive on;

# Private ranges: ALB nodes inside the VPC, and Docker networks for local runs.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;

# Cloudflare edge ranges, from https://www.cloudflare.com/ips-v4 and /ips-v6
# (fetched 2026-10-28). Keep in sync with the ALB security group (Task 7).
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
