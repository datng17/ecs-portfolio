# CI: every push to main (and every PR to main) runs the same checks as the local Docker-based workflow.
#
#   app        lint, unit tests with coverage, production build (Node 24, same as the Dockerfile builder)
#   container  hadolint, Trivy config, native arm64 build, size gate, Trivy image, read-only smoke test
#   iac        terraform fmt, tflint, checkov, validate (bootstrap/dev/prod), terraform test (modules/ecs)
#   secrets    gitleaks over the pushed commits (full history on the first push)
#   plan       terraform plan for dev and prod via OIDC (role portfolio-gha-plan), output in the job summary
#
# Supply chain: every action is pinned to a full commit SHA, every scanner image to a digest.
# Setup checklist (variables, secrets, OIDC provider): docs/RUNBOOK.md, "GitHub setup".
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  AWS_REGION: ap-southeast-2
  TERRAFORM_VERSION: 1.16.3
  # Same tool versions as the local evidence (evidence/02-04, 06). Bump tag comment and digest together.
  HADOLINT_IMAGE: hadolint/hadolint@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d # 2.15.1
  TRIVY_IMAGE: aquasec/trivy@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c # 0.76.1
  TFLINT_IMAGE: ghcr.io/terraform-linters/tflint@sha256:2788f4d4fc663c0e953b011b01bf443fe5bfce7587ee916e588e6057b85d6359 # 0.65.0
  CHECKOV_IMAGE: bridgecrew/checkov@sha256:4b65e89f1fde292249fc0aa0d0db43302c036dfe39f7370b2d3517571082b894 # 3.3.30
  GITLEAKS_IMAGE: zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f # 8.30.1

jobs:
  app:
    name: app (lint, test, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:ci

      - name: Build
        env:
          CI: "true"
          GENERATE_SOURCEMAP: "false"
          INLINE_RUNTIME_CHUNK: "false"
        run: npm run build

  container:
    name: container (arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: hadolint
        run: docker run --rm -i "$HADOLINT_IMAGE" hadolint --failure-threshold style - < Dockerfile

      - name: Trivy config (Dockerfile)
        run: |
          docker run --rm -v "$PWD/Dockerfile:/src/Dockerfile:ro" "$TRIVY_IMAGE" \
            config --exit-code 1 /src

      - name: Build (native arm64)
        run: docker buildx build --platform linux/arm64 --load -t portfolio:local .

      - name: Size gate (compressed < 50 MB)
        run: |
          bytes=$(docker save portfolio:local | gzip -c | wc -c)
          mb=$(awk "BEGIN { printf \"%.1f\", $bytes / 1048576 }")
          echo "Compressed image size: ${mb} MB"
          echo "Compressed image size: **${mb} MB** (limit 50 MB)" >> "$GITHUB_STEP_SUMMARY"
          [ "$bytes" -lt $((50 * 1024 * 1024)) ]

      - name: Trivy image (HIGH/CRITICAL gate)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" \
            image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 portfolio:local

      - name: Smoke test (read-only container)
        run: |
          docker compose up -d --no-build --wait --wait-timeout 60
          sh scripts/smoke.sh http://localhost:8080

      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color || true

      - name: Stop container
        if: always()
        run: docker compose down || true

  iac:
    name: iac (fmt, tflint, checkov, validate, test)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "0"
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache
      # Modules have no committed lock file; let them reuse the cached providers in this ephemeral job.
      TF_PLUGIN_CACHE_MAY_BREAK_DEPENDENCY_LOCK_FILE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform -chdir=infra fmt -recursive -check -diff

      # tflint and checkov run before any `terraform init`, so they never see .terraform/ directories.
      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }} # avoids GitHub API rate limits on the plugin download
        run: |
          mkdir -p "$HOME/.tflint.d"
          tflint() {
            docker run --rm -e GITHUB_TOKEN -v "$PWD/infra:/data:ro" -v "$HOME/.tflint.d:/root/.tflint.d" \
              -w "/data/$1" "$TFLINT_IMAGE" --config /data/.tflint.hcl "${@:2}"
          }
          tflint bootstrap --init
          rc=0
          for d in bootstrap envs/dev envs/prod $(cd infra && ls -d modules/*/); do
            d=${d%/}
            echo "::group::tflint $d"
            tflint "$d" --format compact || rc=1
            echo "::endgroup::"
          done
          exit $rc

      - name: checkov
        run: |
          docker run --rm -v "$PWD/infra:/infra:ro" "$CHECKOV_IMAGE" \
            -d /infra --framework terraform --quiet --compact

      - name: terraform validate
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          for d in bootstrap envs/dev envs/prod; do
            echo "::group::validate $d"
            terraform -chdir="infra/$d" init -backend=false -input=false -no-color
            terraform -chdir="infra/$d" validate -no-color
            echo "::endgroup::"
          done

      - name: terraform test (modules/ecs, mocked provider)
        run: |
          terraform -chdir=infra/modules/ecs init -backend=false -input=false -no-color
          terraform -chdir=infra/modules/ecs test -no-color

  secrets:
    name: secrets (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: gitleaks
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          SHA: ${{ github.sha }}
        run: |
          range=""
          if [ "$EVENT" = pull_request ]; then
            range="$PR_BASE..$SHA"
          elif [ "$EVENT" = push ] && [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] \
               && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..$SHA"
          fi
          echo "Scan range: ${range:-full history}"
          docker run --rm -v "$PWD:/repo:ro" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            "$GITLEAKS_IMAGE" git /repo --redact --no-banner -v ${range:+--log-opts="$range"}

  plan:
    name: plan (${{ matrix.env }})
    needs: [app, container, iac, secrets]
    # The gha-plan role trusts only repo:datng17@179402133/ecs-portfolio@1435398390:ref:refs/heads/main
    # (immutable subject claim), so no PRs and no `environment:` on this job (it would change the OIDC sub
    # claim). Skipped until AWS_PLAN_ROLE_ARN is set.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.AWS_PLAN_ROLE_ARN != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: dev
            image_tag: ${{ vars.TF_DEV_IMAGE_TAG }}
            origin_secret_version: ${{ vars.TF_DEV_ORIGIN_SECRET_VERSION }}
          - env: prod
            image_tag: ${{ vars.TF_PROD_IMAGE_TAG }}
            origin_secret_version: ${{ vars.TF_PROD_ORIGIN_SECRET_VERSION }}
    concurrency:
      group: terraform-${{ matrix.env }}
      cancel-in-progress: false
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "0"
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Plan inputs
        env:
          IMAGE_TAG: ${{ matrix.image_tag }}
          ORIGIN_SECRET_VERSION: ${{ matrix.origin_secret_version }}
        run: |
          if [ -z "$TF_VAR_alert_email" ]; then
            echo "::error::Repository secret ALERT_EMAIL is not set (see docs/RUNBOOK.md, GitHub setup)."
            exit 1
          fi
          # Unset variables fall back to the defaults in infra/envs/<env>/variables.tf.
          if [ -n "$IMAGE_TAG" ]; then echo "TF_VAR_image_tag=$IMAGE_TAG" >> "$GITHUB_ENV"; fi
          if [ -n "$ORIGIN_SECRET_VERSION" ]; then echo "TF_VAR_origin_secret_version=$ORIGIN_SECRET_VERSION" >> "$GITHUB_ENV"; fi

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          role-session-name: gha-plan-${{ matrix.env }}-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: terraform init
        run: terraform -chdir="infra/envs/${{ matrix.env }}" init -input=false -no-color

      - name: terraform plan
        id: plan
        env:
          ENV_NAME: ${{ matrix.env }}
        run: |
          set +e
          terraform -chdir="infra/envs/$ENV_NAME" plan -input=false -lock-timeout=120s -no-color \
            -detailed-exitcode -out=tfplan
          code=$?
          set -e
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          # 0 = no changes, 2 = changes present (expected for prod, which is never applied). 1 = error.
          [ "$code" -eq 0 ] || [ "$code" -eq 2 ]

      - name: Plan to job summary
        if: always() && steps.plan.outputs.exitcode != ''
        env:
          ENV_NAME: ${{ matrix.env }}
          CODE: ${{ steps.plan.outputs.exitcode }}
        run: |
          case "$CODE" in
            0) result="No changes" ;;
            2) result="Changes present" ;;
            *) result="Plan failed (exit $CODE)" ;;
          esac
          text=""
          if [ -f "infra/envs/$ENV_NAME/tfplan" ]; then
            text=$(terraform -chdir="infra/envs/$ENV_NAME" show -no-color tfplan)
          fi
          # The alert address is private (not secret) and not marked sensitive in Terraform; keep it out of the summary.
          text=${text//"$TF_VAR_alert_email"/<redacted>}
          summary=$(printf '%s\n' "$text" | grep -E '^(Plan:|No changes\.)' | tail -n1 || true)
          max=900000 # job summaries are limited to 1 MiB
          if [ "${#text}" -gt "$max" ]; then text="${text:0:$max}"$'\n... (truncated)'; fi
          {
            echo "## Terraform plan: \`$ENV_NAME\`"
            echo
            echo "**Result:** $result. ${summary}"
            echo
            echo "<details><summary>Full plan</summary>"
            echo
            echo '```'
            printf '%s\n' "$text"
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
          # The binary plan holds sensitive values; it is never uploaded.
          rm -f "infra/envs/$ENV_NAME/tfplan"
