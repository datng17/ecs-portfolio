# CD: after CI succeeds for a push to main, deploy that exact commit to dev, then (only when enabled) to prod.
#
#   CI (push to main, success) --workflow_run--> deploy (dev) --> deploy (prod, approval-gated)
#
# The deploy steps live in deploy-ecs.yml (reusable). Gates:
#   vars.CD_ENABLED == 'true'    repository variable; leave unset until the OIDC provider exists (B-1)
#   vars.PROD_ENABLED == 'true'  repository variable; stays unset (prod is never deployed, R2)
# Setup checklist: docs/RUNBOOK.md, "GitHub setup".
name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  dev:
    name: dev
    # Only a green CI run of a push to main in this repository (not a PR, not a fork, not a manual dispatch).
    if: >-
      vars.CD_ENABLED == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-ecs.yml
    with:
      environment: dev
      sha: ${{ github.event.workflow_run.head_sha }}
      smoke-url: https://test.name.vn

  prod:
    name: prod
    needs: dev
    # The prod environment adds a required reviewer and the portfolio-gha-deploy-prod role.
    if: vars.PROD_ENABLED == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-ecs.yml
    with:
      environment: prod
      sha: ${{ github.event.workflow_run.head_sha }}
      # prod reuses the only certificate (test.name.vn, design.md); a real prod would have its own hostname.
      smoke-url: https://test.name.vn
